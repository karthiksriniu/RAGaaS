<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tab-sized cut of the MyBizCare voice orb (see components/Logo.tsx).
       Deliberately the simplified mark: a favicon is shown at 16-32px, where
       the logo's second ring of arcs closes up into a smudge. One arc a side,
       a bigger orb, and no halo - it has to survive at 16px, not look rich. -->
  <defs>
    <linearGradient id="icon-mark" x1="9" y1="9" x2="31" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22BCCE"/>
      <stop offset="1" stop-color="#006874"/>
    </linearGradient>
  </defs>
  <circle cx="20" cy="20" r="11" fill="url(#icon-mark)"/>
  <rect x="14.6" y="17" width="2.7" height="6" rx="1.35" fill="white"/>
  <rect x="18.65" y="14.5" width="2.7" height="11" rx="1.35" fill="white"/>
  <rect x="22.7" y="17" width="2.7" height="6" rx="1.35" fill="white"/>
  <g stroke="#22BCCE" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M32.26 9.71 A16 16 0 0 1 32.26 30.29"/>
    <path d="M7.74 9.71 A16 16 0 0 0 7.74 30.29"/>
  </g>
</svg>
